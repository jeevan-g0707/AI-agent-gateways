# Real services for the integration tests (tests/test_integration_*.py). Not validated in the authoring sandbox
# (no Docker daemon there); the same tests were run against locally started redis-server 7.0, PostgreSQL 16.15 and moto.
#
#   docker compose -f docker-compose.integration.yml up -d
#   export GATEWAY_TEST_REDIS_URL=redis://localhost:6379/15
#   export GATEWAY_TEST_PG_DSN=postgresql://postgres:pw@localhost:5432/postgres
#   export GATEWAY_TEST_S3_ENDPOINT=http://localhost:9000 AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin
#   pytest -m integration
#
# MinIO implements Object Lock itself (including refusing to shorten COMPLIANCE retention), so it is a stricter
# stand-in than moto. For the final word, point GATEWAY_TEST_S3_ENDPOINT at a real, throwaway AWS bucket setup
# (omit the endpoint override in your own fixture) with RetentionDays=1.
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: pw}
    ports: ["5432:5432"]
  minio:
    image: minio/minio
    command: server /data
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000"]
