[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.7.2"
description = "Policy-bounded execution gateway for autonomous AI agent tool calls"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "cryptography>=42", "httpx>=0.27", "pyjwt[crypto]>=2.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
redis = ["redis>=5.0"]
aws = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "fakeredis>=2.20", "redis>=5.0", "fastapi>=0.110", "uvicorn>=0.27", "aiosmtpd>=1.4", "boto3>=1.34", "psycopg[binary]>=3.1", "moto[server]>=5.0", "cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: runs against real Redis/PostgreSQL/S3 services (started locally if installed, or taken from GATEWAY_TEST_* env vars)"]
