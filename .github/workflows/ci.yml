name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-gateway
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pw}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379/15
      GATEWAY_TEST_PG_DSN: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,aws,postgres]" "moto[server]" cfn-lint
      - run: cfn-lint deploy/audit-bucket.cloudformation.yaml
      - run: pytest -q
